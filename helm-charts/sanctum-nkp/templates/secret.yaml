apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sanctum.fullname" . }}-secrets
  labels:
    {{- include "sanctum.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENCRYPTION_KEY: {{ include "sanctum.encryptionKey" . | quote }}
  AUTH_SECRET: {{ include "sanctum.authSecret" . | quote }}
  {{- if .Values.redis.enabled }}
  {{- $redisPassword := include "sanctum.redisPassword" . }}
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  REDIS_URL: {{ printf "redis://:%s@%s-redis:%v" $redisPassword (include "sanctum.fullname" .) .Values.redis.port | quote }}
  {{- else }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
  {{- if not .Values.postgres.cnpg.enabled }}
  # Only used when CNPG is disabled and an external Postgres is provided.
  DB_CONNECTION_URI: {{ .Values.postgres.externalConnectionUri | quote }}
  {{- end }}
