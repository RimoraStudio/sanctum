# Default values for the Sanctum chart (NKP catalog build).
# These mirror the params helmify extracts from ./manifests, cleaned up so the
# common knobs are configurable from the NKP UI.

replicaCount: 1

image:
  repository: sanctum/sanctum
  tag: "v0.162.11"
  pullPolicy: IfNotPresent

# Non-secret application configuration (rendered into a ConfigMap).
config:
  # REQUIRED. External origin users reach Sanctum at, e.g. https://sanctum.example.com
  # (scheme + hostname only; Sanctum cannot be served under a path prefix).
  # Used for CORS, invite/reset/verification links, SSO/OAuth redirect URIs and
  # WebAuthn. The install fails with a clear error if this is left empty.
  siteUrl: ""
  port: 8080
  telemetryEnabled: false

# Sensitive configuration (rendered into a Secret).
# Leave encryptionKey / authSecret empty to have the chart generate random
# values on first install (persisted across upgrades).
secrets:
  encryptionKey: ""            # openssl rand -hex 16
  authSecret: ""               # openssl rand -base64 32
  # Only used when redis.enabled=false (external Redis). When redis.enabled=true
  # the chart wires REDIS_URL to the in-cluster Redis service automatically.
  redisUrl: ""

# Lightweight in-cluster Valkey, the open-source Redis-compatible fork
# (Sanctum requires REDIS_URL). The values keys keep the redis.* naming since
# the wire protocol and connection URL are Redis-compatible. Set enabled=false
# to point at an external Redis/Valkey via secrets.redisUrl instead.
redis:
  enabled: true
  image:
    repository: valkey/valkey
    tag: "8.1-alpine"
    pullPolicy: IfNotPresent
  port: 6379
  # Restrict Valkey ingress to the Sanctum pods (enforced where the CNI
  # supports NetworkPolicy). The bundled Valkey is also password-protected with
  # a generated password stored in the chart Secret (REDIS_PASSWORD).
  networkPolicy: true

# PostgreSQL is provided by the NKP CloudNativePG (CNPG) operator.
# REQUIRES the CloudNativePG platform application to be enabled in the
# workspace/cluster (it ships with NKP).
postgres:
  cnpg:
    # When true, the chart creates a CNPG "Cluster" and wires Sanctum to the
    # auto-generated "<release>-db-app" secret (its "uri" key).
    enabled: true
    instances: 1
    storageSize: 20Gi
    storageClass: ""           # empty = cluster default StorageClass
    database: sanctum
    owner: sanctum
    # imageName: ""            # optional image pin; else CNPG operator default
  # To use an external Postgres instead, set cnpg.enabled=false and provide a
  # full connection string here (postgres://user:pass@host:5432/db?sslmode=...).
  externalConnectionUri: ""

# Run "npm run migration:latest" as an initContainer before the app starts.
migration:
  enabled: true

# Additional environment variables for the Sanctum container, in Kubernetes
# EnvVar format. Useful for optional configuration such as SMTP, for example:
# extraEnv:
#   - name: SMTP_HOST
#     value: smtp.example.com
#   - name: SMTP_PORT
#     value: "587"
#   - name: SMTP_FROM_ADDRESS
#     value: sanctum@example.com
#   - name: SMTP_USERNAME
#     value: mailer
#   - name: SMTP_PASSWORD          # reference a Secret for sensitive values
#     valueFrom:
#       secretKeyRef:
#         name: my-smtp-secret
#         key: password
extraEnv: []

service:
  type: ClusterIP
  port: 8080

# TLS is handled by the NKP kommander-traefik controller via the router
# annotations below; there is no separate tls toggle.
ingress:
  enabled: true
  className: kommander-traefik
  host: sanctum.example.com
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
