services:
  backend:
    container_name: sanctum-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    image: ghcr.io/rimorastudio/sanctum:latest # PIN THIS TO A SPECIFIC TAG
    build:
      context: .
      dockerfile: Dockerfile.standalone-sanctum
    pull_policy: missing
    env_file: .env
    ports:
      - 80:8080
    environment:
      - NODE_ENV=production
      - DB_CONNECTION_URI=${DB_CONNECTION_URI:-postgres://sanctum:sanctum@db:5432/sanctum}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    networks:
      - sanctum

  redis:
    image: redis
    container_name: sanctum-dev-redis
    env_file: .env
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - sanctum
    volumes:
      - redis_data:/data

  db:
    container_name: sanctum-db
    image: postgres:14-alpine
    restart: always
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sanctum}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sanctum}
      - POSTGRES_DB=${POSTGRES_DB:-sanctum}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sanctum
    healthcheck:
      test: "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  sanctum:
