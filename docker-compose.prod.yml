services:
  backend:
    container_name: sanctum-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    image: ghcr.io/rimorastudio/sanctum:latest # PIN THIS TO A SPECIFIC TAG
    pull_policy: always
    env_file: .env
    ports:
      - ${SANCTUM_HTTP_PORT:-8080}:8080
    environment:
      - NODE_ENV=production
      - TELEMETRY_ENABLED=false
      - OTEL_TELEMETRY_COLLECTION_ENABLED=false
      - NODE_OPTIONS=--max-old-space-size=${NODE_MAX_HEAP_MB:-768}
      - DB_CONNECTION_URI=${DB_CONNECTION_URI:-postgres://sanctum:sanctum@db:5432/sanctum}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    deploy:
      resources:
        limits:
          memory: ${SANCTUM_MEM_LIMIT:-1G}
    networks:
      - sanctum

  redis:
    image: redis
    container_name: sanctum-dev-redis
    env_file: .env
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      - sanctum
    volumes:
      - redis_data:/data

  db:
    container_name: sanctum-db
    image: postgres:14-alpine
    restart: always
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sanctum}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sanctum}
      - POSTGRES_DB=${POSTGRES_DB:-sanctum}
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sanctum
    healthcheck:
      test: "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  sanctum:
