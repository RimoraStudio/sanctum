services:
  backend:
    container_name: sanctum-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    image: ghcr.io/rimorastudio/sanctum:latest # PIN THIS TO A SPECIFIC TAG
    pull_policy: always
    env_file: .env
    environment:
      - NODE_ENV=production
      - TELEMETRY_ENABLED=false
      - OTEL_TELEMETRY_COLLECTION_ENABLED=false
      - NODE_OPTIONS=--max-old-space-size=${NODE_MAX_HEAP_MB:-768}
      - DB_CONNECTION_URI=${DB_CONNECTION_URI:-postgres://sanctum:sanctum@db:5432/sanctum}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    deploy:
      resources:
        limits:
          memory: ${SANCTUM_MEM_LIMIT:-1G}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sanctum

  redis:
    image: redis:7-alpine
    container_name: sanctum-dev-redis
    env_file: .env
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - sanctum
    volumes:
      - redis_data:/data

  db:
    container_name: sanctum-db
    image: postgres:14-alpine
    restart: always
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sanctum}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sanctum}
      - POSTGRES_DB=${POSTGRES_DB:-sanctum}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=8MB", "-c", "max_connections=50"]
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sanctum
    healthcheck:
      test: "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  sanctum:
